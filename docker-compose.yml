services:
  # ---------------------------------------------------------------------------
  # Database Service
  # ---------------------------------------------------------------------------
  postgres_db:
    image: postgres:15-alpine
    container_name: nutrition_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutritiondb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Application Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutrition_api
    restart: always
    # Automatically seed the database, then launch the API:
    command: sh -c "python app/seeding.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_NAME=nutritiondb
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local 