version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Database Service
  # ---------------------------------------------------------------------------
  postgres_db:
    image: postgres:15-alpine
    container_name: nutrition_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nutritiondb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutritiondb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Application Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutrition_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_NAME=nutritiondb
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local